<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login Page</h1>

    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}
    {% if success_message %}
        <p style="color: green;">{{ success_message }}</p>
    {% endif %}

    <!-- Llamamos a la función validateForm() al enviar el formulario -->
    <form method="post" action="/login" onsubmit="return validateForm()">
        <label for="usuario">Username:</label>
        <input type="text" name="usuario" id="usuario" required>
        
        <label for="password">Contrasenya:</label>
        <input type="password" name="password" id="password" required>
    
        <button type="submit">Iniciar sesión</button>
    </form>

    <script>
      function validateForm() {
        const usernameInput = document.getElementById("usuario");
        const passwordInput = document.getElementById("password");

        const usernameValue = usernameInput.value.trim();
        const passwordValue = passwordInput.value;

        const usernameRegex = /^[A-Za-z0-9_]{3,20}$/;
        if (!usernameRegex.test(usernameValue)) {
          alert("El nombre de usuario debe tener entre 3 y 20 caracteres alfanuméricos (puede incluir guión bajo).");
          return false;
        }

        // 2. Validar longitud de la contraseña (máximo 25 caracteres)
        if (passwordValue.length > 25) {
          alert("La contraseña no puede exceder los 25 caracteres.");
          return false;
        }

        // 3. Bloquear caracteres peligrosos en la contraseña (por ejemplo: comillas, =)
        const forbiddenChars = /['"=]/;
        if (forbiddenChars.test(passwordValue)) {
          alert("La contraseña contiene caracteres no permitidos (', \", =).");
          return false;
        }

        return true; // Si todo está bien, se envía el formulario
      }
    </script>
</body>
</html>
